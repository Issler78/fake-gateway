server:
  port: 8090
spring:
  application:
    name: fake-gateway
    api-key: ${API_KEY}
    your-api-key: ${YOUR_API_KEY}
    your-api-url: "http://localhost:8080" # if deploy, insert here url
  datasource:
    url: jdbc:postgresql://localhost:5432/fake_gateway
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update # Use 'update' for development, 'validate' for production
    show-sql: true
    properties:
      hibernate:
        format_sql: true
payment:
  confirm-delay-ms: 5000